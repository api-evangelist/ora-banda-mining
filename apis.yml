name: Ora Banda Mining

description: 'Ora Banda Mining Ltd (OBM) is a West Australian gold producer based in the historic Eastern Goldfields.
  Its Davyhurst gold project comprises several operating mines (the Riverina and Sand King underground mines) and the
  established Davyhurst processing plant, with systematic exploration across the Riverina, Round Dam, Siberia, Mulline,
  Callion and Python trends. The company states a strategy of creating value through exploring, developing and delivering
  organic growth. Surfaced via the API Evangelist harvest backlog (australia-apidays-2026); the company website publishes
  no developer portal, API documentation or public API.'

